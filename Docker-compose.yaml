services:
  backend:
    image: phuson0206/car-marketplace-backend:latest
    container_name: car-marketplace-backend
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    image: phuson0206/car-marketplace-frontend:latest
    container_name: car-marketplace-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped