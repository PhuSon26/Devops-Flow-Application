services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: car-marketplace-backend:1.0.0
    container_name: car-marketplace-backend
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: car-marketplace-frontend:1.0.0
    container_name: car-marketplace-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped